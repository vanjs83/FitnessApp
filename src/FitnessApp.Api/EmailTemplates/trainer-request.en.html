<!--
  Notifies a trainer that a client sent a coaching request — EN
  Placeholders: {{TrainerName}} {{ClientName}} {{LoginUrl}}
-->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>New coaching request</title></head>
<body style="margin:0;background:#f4f6f9;font-family:Arial,sans-serif;color:#222;">
<div style="max-width:600px;margin:0 auto;padding:24px;">
  <div style="border-bottom:2px solid #4dabf7;padding-bottom:12px;margin-bottom:20px;">
    <h2 style="margin:0;color:#4dabf7;">&#128170; FitnessApp</h2>
  </div>

  <p>Hi <strong>{{TrainerName}}</strong>,</p>
  <p>
    Client <strong>{{ClientName}}</strong> has sent you a <strong>coaching request</strong> in the FitnessApp.
  </p>
  <p>
    Sign in and go to <em>Clients</em> &rarr; <em>Coaching requests</em> to <strong>accept</strong> or
    <strong>reject</strong> it.
  </p>

  <p>
    <a href="{{LoginUrl}}" style="display:inline-block;background:#4dabf7;color:#fff;padding:10px 18px;border-radius:6px;text-decoration:none;">
      Open FitnessApp
    </a>
  </p>

  <div style="margin-top:30px;padding-top:16px;border-top:1px solid #eee;color:#888;font-size:13px;">
    Sent via the FitnessApp platform. If you reply to this email, your reply goes straight to the client.
  </div>
</div>
</body>
</html>
