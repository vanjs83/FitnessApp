name: .NET CI/CD Pipeline (Build + Test + FTP Deploy)

on:
  push:
    branches: [ "master" ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      # 3. Restore
      - name: Restore dependencies
        run: dotnet restore FitnessApp.sln

      # 4. Build
      - name: Build solution
        run: dotnet build FitnessApp.sln --configuration Release --no-restore

      # 5. Test
      - name: Run tests
        run: dotnet test FitnessApp.sln --configuration Release --no-build --verbosity normal

      # 6. Publish (BITNO - ovo stvara deploy folder)
      - name: Publish application
        run: dotnet publish FitnessApp.sln -c Release -o publish

      # 7. Check publish folder (debug)
      - name: Verify publish output
        run: ls -la publish


      # 🔴 STOP APP (App Offline mode)
      - name: Enable maintenance mode
        run: |
          echo "Maintenance mode" > publish/app_offline.htm


      # 8. FTP Deploy to SmartASP
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: publish/
          server-dir: /fitnessapp/tvanjurek-001-site1.ltempurl.com/
          dangerous-clean-slate: true
          log-level: verbose

      # 🟢 START APP (remove maintenance mode)
      - name: Disable maintenance mode
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: empty/
          server-dir: /
          exclude: "**/*"

      # 9. Info log (audit-friendly)
      - name: Print build info
        run: |
          echo "Repo: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"