name: .NET CI/CD Pipeline (Build + Test + FTP Deploy)

on:
  push:
    branches: [ "master" ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      # 3. Restore
      - name: Restore dependencies
        run: dotnet restore FitnessApp.sln

      # 4. Build
      - name: Build solution
        run: dotnet build FitnessApp.sln --configuration Release --no-restore

      # 5. Test
      - name: Run tests
        run: dotnet test FitnessApp.sln --configuration Release --no-build --verbosity normal

      # 6. Publish (BITNO - ovo stvara deploy folder)
      - name: Publish application
        run: dotnet publish FitnessApp.sln -c Release -o publish

      # 7. Check publish folder (debug)
      - name: Verify publish output
        run: ls -la publish


      # 🔴 STEP 1: Take the app OFFLINE first (separate upload).
      # Uploading app_offline.htm makes the ASP.NET Core Module stop the app,
      # which releases the lock on FitnessApp.Api.dll so it can be overwritten.
      - name: Create maintenance file
        run: echo "Deploying, back shortly..." > app_offline.htm

      - name: Take app offline (upload app_offline.htm first)
        run: |
          curl -sS --fail -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            -T app_offline.htm \
            "ftp://${{ secrets.FTP_SERVER }}/fitnessapp/tvanjurek-001-site1.ltempurl.com/app_offline.htm"

      - name: Wait for the app to shut down
        run: sleep 12

      # 🟢 STEP 2: Incremental FTP deploy (NO clean-slate).
      # The DLL is now unlocked (app is offline), so it overwrites fine, while
      # untracked server files (firebase/, wwwroot/uploads/, logs/) are LEFT INTACT.
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: publish/
          server-dir: /fitnessapp/tvanjurek-001-site1.ltempurl.com/
          log-level: verbose
          exclude: |
            **/app_offline.htm

      # 🔵 STEP 3: Bring the app back ONLINE (remove app_offline.htm).
      - name: Bring app online (delete app_offline.htm)
        run: |
          curl -sS -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            "ftp://${{ secrets.FTP_SERVER }}/fitnessapp/tvanjurek-001-site1.ltempurl.com/" \
            -Q "-DELE app_offline.htm"

      # 9. Info log (audit-f riendly)
      - name: Print build info
        run: |
          echo "Repo: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"